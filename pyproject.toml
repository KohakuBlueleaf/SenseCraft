[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensecraft"
version = "0.4.0"
description = "Perceptual and signal losses for image and video models"
authors = [
    { name = "Shih-Ying Yeh(KohakuBlueLeaf)", email = "apolloyeh0123@gmail.com" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.9",
    "safetensors",
    "pytorch-msssim",
]
urls = { "Homepage" = "https://kblueleaf.net/SenseCraft" }

[project.optional-dependencies]
dinov3 = ["huggingface_hub"]
dev = ["black", "ruff"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
sensecraft = ["weights/*.safetensors"]

[tool.ruff.lint.per-file-ignores]
# Timing closures run inside the loop iteration that defines them
"measure/*" = ["B023"]
